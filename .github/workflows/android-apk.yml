
name: Prime Ludo APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname 'PrimeLudo_Android_Project.zip' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "Android project ZIP not found!"
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_FILE=$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)

            if [ -z "$PROJECT_FILE" ]; then
              echo "Gradle project not found inside ZIP!"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT_FILE")
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Prime Ludo APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Ludo-debug-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
