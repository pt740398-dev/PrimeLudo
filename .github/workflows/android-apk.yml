
name: Prime Ludo APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*PrimeLudo*.zip' | head -n 1)

            if [[ -z "$ZIP_FILE" ]]; then
              echo "Prime Ludo ZIP not found!"
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            SETTINGS=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)

            if [[ -z "$SETTINGS" ]]; then
              echo "Gradle settings file not found!"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$GITHUB_WORKSPACE/$SETTINGS")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Prime Ludo APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

      - name: Prepare APK
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [[ -z "$APK" ]]; then
            echo "APK not generated!"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Prime-Ludo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Ludo-APK
          path: output/Prime-Ludo.apk
          if-no-files-found: error
          retention-days: 14
