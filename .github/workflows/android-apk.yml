
name: Prime Ludo APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: prime-ludo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Prime Ludo Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*PrimeLudo*.zip' -print -quit)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: Prime Ludo project ZIP not found!"
              exit 1
            fi

            mkdir -p extracted-project
            unzip -q "$ZIP_FILE" -d extracted-project

            SETTINGS_FILE="$(find extracted-project -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"

            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: Gradle settings file missing inside ZIP!"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$GITHUB_WORKSPACE/$SETTINGS_FILE")"
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: Android app module missing!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleDebug

      - name: Find APK
        id: apk
        run: |
          set -euo pipefail
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"

          if [[ -z "$APK_FILE" ]]; then
            echo "APK not generated!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/apk-output/Prime-Ludo-debug.apk"
          echo "path=$GITHUB_WORKSPACE/apk-output/Prime-Ludo-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Prime Ludo APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Ludo-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: success()
        run: |
          echo "## Prime Ludo APK build successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Download Prime-Ludo-debug-APK from Artifacts." >> "$GITHUB_STEP_SUMMARY"
