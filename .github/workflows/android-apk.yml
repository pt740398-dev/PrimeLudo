
name: Prime Ludo APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: prime-ludo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Prime Ludo
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find or Extract Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          SETTINGS=$(find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "*/.gradle/*" | head -n 1 || true)

          if [[ -n "$SETTINGS" ]]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
              -iname "*PrimeLudo*.zip" | head -n 1 || true)

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: Prime Ludo project ZIP not found."
              exit 1
            fi

            mkdir -p "$GITHUB_WORKSPACE/extracted"
            unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

            SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -n 1 || true)

            if [[ -z "$SETTINGS" ]]; then
              echo "ERROR: Gradle settings file missing."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && \
                ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1 || true)

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found in $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          gradle --no-daemon --stacktrace \
            clean :app:assembleDebug

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1 || true)

          if [[ -z "$APK" ]]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/Prime-Ludo.apk"

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Ludo-APK
          path: output/Prime-Ludo.apk
          if-no-files-found: error
          retention-days: 14
