
name: Prime Ludo APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: prime-ludo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Prime Ludo APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or Extract Prime Ludo Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          SETTINGS=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' | head -n 1 || true)

          if [[ -n "$SETTINGS" ]]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
              -iname '*PrimeLudo*.zip' | head -n 1 || true)

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: Prime Ludo ZIP or Gradle project not found."
              exit 1
            fi

            mkdir -p "$GITHUB_WORKSPACE/extracted"
            unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

            SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              | head -n 1 || true)

            if [[ -z "$SETTINGS" ]]; then
              echo "ERROR: ZIP does not contain Gradle settings file."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && \
                ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project located: $PROJECT_DIR"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER=$(find "$SDK_ROOT" -type f \
            -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Prime Ludo
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          gradle --no-daemon --stacktrace \
            clean :app:assembleDebug

      - name: Verify and Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1 || true)

          if [[ -z "$APK" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Prime-Ludo-0.2.0.apk"

          echo "APK prepared successfully."

      - name: Upload Prime Ludo APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Ludo-0.2.0-APK
          path: output/Prime-Ludo-0.2.0.apk
          if-no-files-found: error
          retention-days: 14
